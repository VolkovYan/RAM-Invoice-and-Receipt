e:nowrap}.doc-table{border-collapse:collapse;width:100%;font-size:13px;table-layout:fixed}.doc-table th,.doc-table td{border:1px solid #333;padding:7px 8px;vertical-align:top}.doc-table th{text-align:center;font-weight:400}.doc-table .num{text-align:center}.doc-table .description{width:47.6%}.doc-table .qty{width:7.3%}.doc-table .price{width:17.5%}.doc-table .amount{width:21.4%}.doc-table:not(.receipt-table) tbody tr:first-child td{height:224px}.desc{white-space:pre-line;line-height:1.34}.desc strong{font-weight:700}.blue{color:var(--blue)}.inv-bottom{display:grid;grid-template-columns:calc(61.1% - 1px) minmax(0,1fr);gap:0;margin-top:0;font-size:11px;position:relative;border-top:1px solid #222}.doc-table:not(.receipt-table) tbody tr:last-child td{border-bottom:0}.remark{display:grid;grid-template-columns:74px minmax(0,1fr);column-gap:6px;color:#f02727;margin:9px 0 22px;line-height:1.25}.warranty{display:grid;grid-template-columns:118px minmax(0,1fr);column-gap:6px;color:#f02727;line-height:1.25}.totals{border-collapse:collapse;width:100%;font-size:13px;margin-top:0;position:relative;z-index:1}.totals td{border:1px solid #333;padding:7px 9px}.totals td:first-child{width:45.09%;background:#e7e8ea}.totals tr:first-child td{border-top:0}.totals td:last-child{text-align:right}.sign{margin:18px 0 0 auto;width:54%;text-align:center}.sign .signature-space{height:72px;display:flex;align-items:flex-end;justify-content:flex-start;padding-left:4px}.sign .signature-space img{width:auto;max-width:200px;max-height:68px;object-fit:contain;object-position:left bottom;mix-blend-mode:multiply}.signline{border-bottom:2px solid #222;display:flex;justify-content:space-between;padding:2px 4px 5px;font-size:11px}.signname{color:#a31119;font-size:14px;max-width:70%;overflow-wrap:anywhere;text-align:left}.signline span:last-child{white-space:nowrap}.siglabels{display:flex;justify-content:space-between;font-size:11px;padding:4px}.footer{text-align:center;margin-top:55px;font-size:11px;line-height:1.4}.receipt .header{display:block;position:relative}.receipt .title{position:absolute;top:8px;right:0;width:62%;text-align:right;font-size:22px;margin:0;white-space:nowrap}.receipt .logo{width:88px;height:62px;margin-bottom:1px}.receipt .company{font-size:16px}.receipt .tagline{font-size:13px}.receipt-top{display:flex;justify-content:space-between;align-items:end;margin:0 0 5px;font-size:15px}.receipt-meta{text-align:right;line-height:1.45;white-space:nowrap}.received{font-size:16px;font-weight:700}.receipt-table{font-size:15px}.receipt-table th,.receipt-table td{padding:5px 8px}.receipt-table .no{width:6%}.receipt-table .description{width:54%}.receipt-table .currency{width:18%}.receipt-table .amount{width:22%}.receipt-desc{white-space:pre-line;line-height:1.12;min-height:88px}.receipt-table tbody tr:first-child td{height:118px}.receipt-signs{display:flex;justify-content:space-between;align-items:end;margin:auto 3% 3px}.receipt-sign{width:160px;text-align:center;font-size:11px}.receipt-sign .signature-space{height:74px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}.receipt-sign .signature-space img{width:auto;max-width:152px;max-height:68px;object-fit:contain;object-position:center bottom;mix-blend-mode:multiply}.receipt-sign .line{border-bottom:2px solid #222;height:5px}.receipt-sign .name{color:#a31119;font-size:14px;min-height:18px}.receipt .doc{display:flex;flex-direction:column}.receipt .footer{margin-top:2px;padding-top:0;font-size:9px;line-height:1.15}.empty{padding:15px;text-align:center;color:#8390a1;font-size:12px}

<script>
const base={type:'invoice',company:'MAEX Co.,Ltd',contact:'Yar Zar Htet',phone:'+959 969 371 114',email:'it@maex.com.mm',invoiceNo:'INE -2026-531',invoiceDate:'2026-10-29',receiptNo:'RNA -2026-826',receiptDate:'2026-10-30',paidBy:'',receivedBy:'Susan Shwine',paymentMethod:'Bank / Cheque No.',currency:'MMK',items:[{description:'Market Management System (MMS)\nEnhancement and New Modules\n\nMAEX PAY Mobile App Integration\n(Include MMQR + One Payment Channel)\n\nManagement Dashboard App Integration\n(50% Advance Deposit)',qty:1,price:21750000}],paid:0,remark:'The remaining 50% (21,750,000 MMK) of the project amount will be invoiced upon project completion.',warranty:'Only Hardware but excluding damages caused by electricity fluctuation, lightning, thundering, natural disaster and misuse from user.',authorizedBy:'Susan Shwine',contactPerson:'Susan Shwine Ms, (+95) 9 420044903, susanshwine@ramsolutions.asia'};
let data;try{data={...base,...JSON.parse(localStorage.getItem('ramDocs')||'{}')};data.items=JSON.parse(localStorage.getItem('ramDocs')||'{}').items||base.items}catch{data=structuredClone(base)}
let signatureBlob=null,signatureUrl='',signatureFile='authorized-signature.png',signatureId='',signatureDbPromise,savedEsigns=[];const receiptEsigns={receivedBy:{blob:null,url:'',file:'received-by-signature.png',id:''}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('en-US');const datefmt=s=>{if(!s)return '';let d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
const fld=(key,label,type='text',value=data[key])=>`<div class="field"><label>${label}</label><input type="${type}" value="${esc(value)}" data-key="${key}"></div>`;const area=(key,label)=>`<div class="field"><label>${label}</label><textarea data-key="${key}">${esc(data[key])}</textarea></div>`;const esignField=()=>`<div class="field esign-field"><label for="savedEsign">Saved e-signatures</label><select id="savedEsign" onchange="chooseSavedEsign(this.value)"><option value="">No e-signature (leave blank)</option>${savedEsigns.map(sig=>`<option value="${esc(sig.id)}" ${sig.id===signatureId?'selected':''}>${esc(sig.name)}</option>`).join('')}</select><label for="esignFile">Upload a new e-signature (PNG / JPG / JPEG)</label><input id="esignFile" type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg"><button class="add esign-save" type="button" onclick="saveEsignToBrowser()">Save to browser</button><small id="esignStatus">Choose a file to preview it. Click Save to browser to keep it for later invoices. Uploading e-signatures to the public GitHub repository makes them visible to anyone.</small></div>`;
const receiptEsignField=(key,label)=>`<div class="field esign-field"><label for="receiptSavedEsign-${key}">Saved e-signatures</label><select id="receiptSavedEsign-${key}" onchange="chooseReceiptSavedEsign('${key}',this.value)"><option value="">No e-signature (leave blank)</option>${savedEsigns.map(sig=>`<option value="${esc(sig.id)}" ${sig.id===receiptEsigns[key].id?'selected':''}>${esc(sig.name)}</option>`).join('')}</select><label for="receiptEsign-${key}">${label} e-sign (PNG / JPG / JPEG)</label><input id="receiptEsign-${key}" type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg" data-receipt-esign="${key}"><button class="add esign-save" type="button" onclick="saveReceiptEsignToBrowser('${key}')">Save to browser</button><small id="receiptEsignStatus-${key}">Choose an image or saved e-signature. Click Save to browser to keep a new upload.</small></div>`;
function openSignatureDb(){if(!window.indexedDB)return Promise.reject(new Error('Browser storage is unavailable'));if(!signatureDbPromise)signatureDbPromise=new Promise((resolve,reject)=>{let request=indexedDB.open('ram-invoice-signatures',1);request.onupgradeneeded=()=>request.result.createObjectStore('images');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});return signatureDbPromise}
function storeSignature(blob,name,id=signatureId){return openSignatureDb().then(db=>new Promise((resolve,reject)=>{let tx=db.transaction('images','readwrite');tx.objectStore('images').put({blob,name,id},'authorized');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)}))}function storeSavedEsign(blob,name,id){return openSignatureDb().then(db=>new Promise((resolve,reject)=>{let tx=db.transaction('images','readwrite');tx.objectStore('images').put({blob,name,id},'esign-library:'+id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)}))}function listSavedEsigns(){return openSignatureDb().then(db=>new Promise((resolve,reject)=>{let tx=db.transaction('images','readonly'),req=tx.objectStore('images').openCursor(),items=[];req.onsuccess=()=>{let cursor=req.result;if(cursor){if(String(cursor.key).startsWith('esign-library:'))items.push(cursor.value);cursor.continue()}else resolve(items)};req.onerror=()=>reject(req.error)}))}
function readSignature(){return openSignatureDb().then(db=>new Promise((resolve,reject)=>{let tx=db.transaction('images','readonly'),req=tx.objectStore('images').get('authorized');req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)}))}function deleteSignature(key){return openSignatureDb().then(db=>new Promise((resolve,reject)=>{let tx=db.transaction('images','readwrite');tx.objectStore('images').delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)}))}
function storeReceiptSignature(key,blob,name,id=''){return openSignatureDb().then(db=>new Promise((resolve,reject)=>{let tx=db.transaction('images','readwrite');tx.objectStore('images').put({blob,name,id},'receipt-'+key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)}))}function readReceiptSignature(key){return openSignatureDb().then(db=>new Promise((resolve,reject)=>{let tx=db.transaction('images','readonly'),req=tx.objectStore('images').get('receipt-'+key);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)}))}
function setEsignStatus(message){let el=document.getElementById('esignStatus');if(el)el.textContent=message}
async function restoreEsign(){try{savedEsigns=await listSavedEsigns();let record=await readSignature();if(record?.blob){signatureBlob=record.blob;signatureFile=record.name||signatureFile;signatureId=record.id||'';if(!signatureId){signatureId='esign-'+Date.now();await storeSignature(signatureBlob,signatureFile,signatureId)}if(!savedEsigns.some(sig=>sig.id===signatureId)){let entry={blob:signatureBlob,name:signatureFile,id:signatureId};await storeSavedEsign(entry.blob,entry.name,entry.id);savedEsigns.push(entry)}signatureUrl=URL.createObjectURL(signatureBlob);buildFields();render();setEsignStatus(`Saved signature loaded: ${signatureFile}`)}else{buildFields()}}catch(e){console.warn('Could not load saved e-signature library',e)}}
async function getSavedEsign(id){let entry=savedEsigns.find(sig=>sig.id===id);if(entry&&!entry.blob&&entry.assetUrl){let response=await fetch(entry.assetUrl);if(!response.ok)throw new Error('Could not load image from GitHub');entry.blob=await response.blob()}return entry?.blob?entry:null}async function chooseSavedEsign(id){if(!id){try{await deleteSignature('authorized')}catch(e){console.warn('Could not clear invoice e-signature',e)}if(signatureUrl)URL.revokeObjectURL(signatureUrl);signatureBlob=null;signatureUrl='';signatureFile='authorized-signature.png';signatureId='';render();setEsignStatus('E-signature removed. This invoice will be left blank.');return}try{let entry=await getSavedEsign(id);if(!entry)return;signatureBlob=entry.blob;signatureFile=entry.name;signatureId=entry.id;if(signatureUrl)URL.revokeObjectURL(signatureUrl);signatureUrl=URL.createObjectURL(signatureBlob);render();setEsignStatus(`Selected saved e-signature: ${signatureFile}`)}catch(e){setEsignStatus(`Could not load e-signature: ${e.message}`)}}async function chooseReceiptSavedEsign(key,id){if(!id){try{await deleteSignature('receipt-'+key)}catch(e){console.warn('Could not clear receipt e-signature',e)}let entry=receiptEsigns[key];if(entry?.url)URL.revokeObjectURL(entry.url);if(entry){entry.blob=null;entry.url='';entry.file='received-by-signature.png';entry.id=''}render();setReceiptEsignStatus(key,'E-signature removed. This receipt signer will be left blank.');return}try{let saved=await getSavedEsign(id);if(!saved)return;let entry=receiptEsigns[key];entry.blob=saved.blob;entry.file=saved.name;entry.id=saved.id;if(entry.url)URL.revokeObjectURL(entry.url);entry.url=URL.createObjectURL(entry.blob);render();setReceiptEsignStatus(key,'Selected saved e-signature: '+entry.file)}catch(e){setReceiptEsignStatus(key,'Could not load e-signature: '+e.message)}}async function saveEsignToBrowser(){if(!signatureBlob){setEsignStatus('Upload or choose an e-signature first.');return}if(!signatureId)signatureId='esign-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);let entry={blob:signatureBlob,name:signatureFile,id:signatureId};try{await Promise.all([storeSignature(signatureBlob,signatureFile,signatureId),storeSavedEsign(signatureBlob,signatureFile,signatureId)]);if(!savedEsigns.some(sig=>sig.id===signatureId))savedEsigns.push(entry);buildFields();render();setEsignStatus(`Saved for reuse in this browser: ${signatureFile}`)}catch(e){setEsignStatus(`Could not save e-signature in browser: ${e.message}`)}}async function loadRepoEsigns(){if(location.hostname!=='volkovyan.github.io')return;try{let response=await fetch('https://api.github.com/repos/VolkovYan/RAM-Invoice-and-Receipt/contents/assets');if(!response.ok)return;let files=await response.json();let remote=files.filter(file=>file.type==='file'&&/\.(png|jpe?g)$/i.test(file.name)).map(file=>({id:'repo-assets:'+file.name,name:file.name,assetUrl:file.download_url}));savedEsigns=savedEsigns.filter(sig=>!sig.id.startsWith('repo-assets:'));savedEsigns.push(...remote);buildFields()}catch(e){console.warn('Could not load e-signatures from GitHub assets',e)}}async function handleEsignUpload(event){let file=event.target.files?.[0];if(!file)return;let allowed=['image/png','image/jpeg'].includes(file.type)||/\.(png|jpe?g)$/i.test(file.name);if(!allowed){event.target.value='';setEsignStatus('Choose a PNG, JPG, or JPEG image.');return}signatureBlob=file.slice(0,file.size,file.type||'image/png');signatureFile=file.name.replace(/[\\/:*?"<>|]/g,'_')||'authorized-signature.png';signatureId='esign-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);if(signatureUrl)URL.revokeObjectURL(signatureUrl);signatureUrl=URL.createObjectURL(signatureBlob);render();let select=document.getElementById('savedEsign');if(select)select.value='';setEsignStatus('Preview ready. Click Save to browser to keep it for later invoices.')}
function setReceiptEsignStatus(key,message){let el=document.getElementById('receiptEsignStatus-'+key);if(el)el.textContent=message}
async function handleReceiptEsignUpload(event){let key=event.target.dataset.receiptEsign,file=event.target.files?.[0];if(!key||!file)return;let allowed=['image/png','image/jpeg'].includes(file.type)||/\.(png|jpe?g)$/i.test(file.name);if(!allowed){event.target.value='';setReceiptEsignStatus(key,'Choose a PNG, JPG, or JPEG image.');return}let entry=receiptEsigns[key];entry.blob=file.slice(0,file.size,file.type||'image/png');entry.file=file.name.replace(/[\\/:*?"<>|]/g,'_')||key+'-signature.png';entry.id='esign-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);if(entry.url)URL.revokeObjectURL(entry.url);entry.url=URL.createObjectURL(entry.blob);render();setReceiptEsignStatus(key,'Preview ready. Click the browser save button to keep it for later receipts.')}async function saveReceiptEsignToBrowser(key){let entry=receiptEsigns[key];if(!entry?.blob){setReceiptEsignStatus(key,'Upload or choose an e-signature first.');return}if(!entry.id)entry.id='esign-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);let saved={blob:entry.blob,name:entry.file,id:entry.id};try{await Promise.all([storeReceiptSignature(key,entry.blob,entry.file,entry.id),storeSavedEsign(entry.blob,entry.file,entry.id)]);if(!savedEsigns.some(sig=>sig.id===entry.id))savedEsigns.push(saved);buildFields();render();setReceiptEsignStatus(key,'Saved in this browser: '+entry.file)}catch(e){setReceiptEsignStatus(key,'Could not save in browser: '+e.message)}}
async function restoreReceiptEsigns(){for(let key of ['receivedBy'])try{let record=await readReceiptSignature(key);if(record?.blob){let entry=receiptEsigns[key];entry.blob=record.blob;entry.file=record.name||entry.file;entry.id=record.id||'';if(!entry.id){entry.id='esign-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);await storeReceiptSignature(key,entry.blob,entry.file,entry.id)}if(!savedEsigns.some(sig=>sig.id===entry.id)){let saved={blob:entry.blob,name:entry.file,id:entry.id};savedEsigns.push(saved);await storeSavedEsign(saved.blob,saved.name,saved.id)}entry.url=URL.createObjectURL(record.blob)}}catch(e){console.warn('Could not load receipt '+key+' e-signature',e)}buildFields();render()}


function buildFields(){let receipt=data.type==='receipt';document.getElementById('fields').innerHTML=`<div class="section"><h3>Customer details</h3>${fld('company','Company name')}${fld('contact','Contact person')}${fld('phone','Phone')}${fld('email','Email')}${receipt?fld('receiptNo','Receipt number'):fld('invoiceNo','Invoice number')}${fld(receipt?'receiptDate':'invoiceDate','Date','date')}</div><div class="section"><h3>Line items</h3><div id="itemFields">${data.items.map((it,i)=>`<div class="item-edit"><div class="item-head"><span>Item ${i+1}</span><button class="del" onclick="removeItem(${i})">Remove</button></div><div class="field"><label>Description</label><textarea data-item="${i}" data-col="description">${esc(it.description)}</textarea></div><div class="row"><div class="field"><label>Quantity</label><input type="number" min="0" step="any" data-item="${i}" data-col="qty" value="${esc(it.qty)}"></div><div class="field"><label>Unit price (MMK)</label><input type="number" min="0" step="any" data-item="${i}" data-col="price" value="${esc(it.price)}"></div></div></div>`).join('')}</div><button class="add" onclick="addItem()">+ Add line item</button></div>${receipt?`<div class="section"><h3>Payment</h3>${fld('paymentMethod','Payment channel')}${fld('currency','Currency')}${fld('paidBy','Paid by')}${fld('receivedBy','Received by')}${receiptEsignField('receivedBy','Received By')}</div>`:`<div class="section"><h3>Invoice notes</h3>${fld('paid','Paid amount (MMK)','number')}${area('remark','Remark')}${area('warranty','Warranty term')}${fld('authorizedBy','Authorized by')}${esignField()}</div>`}<div class="section"><h3>Company footer</h3>${fld('contactPerson','Contact information')}</div>`;
document.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('input',()=>{data[el.dataset.key]=el.value;save(false);render()}));document.getElementById('esignFile')?.addEventListener('change',handleEsignUpload);document.querySelectorAll('[data-receipt-esign]').forEach(el=>el.addEventListener('change',handleReceiptEsignUpload));document.querySelectorAll('[data-item]').forEach(el=>el.addEventListener('input',()=>{let it=data.items[el.dataset.item];let c=el.dataset.col;it[c]=c==='description'?el.value:Number(el.value);save(false);render()}));}
function render(){let receipt=data.type==='receipt';document.getElementById('paper').classList.toggle('receipt',receipt);document.getElementById('tabInvoice').classList.toggle('active',!receipt);document.getElementById('tabReceipt').classList.toggle('active',receipt);document.getElementById('viewTitle').textContent=receipt?'Receipt preview · A5 landscape':'Invoice preview · A4 portrait';let amount=data.items.reduce((s,i)=>s+(Number(i.qty)||0)*(Number(i.price)||0),0);let rows=data.items.map((i,n)=>`<tr><td class="num">${n+1}</td><td class="${receipt?'receipt-desc':'desc'}">${esc(i.description)}</td>${receipt?`<td></td><td class="num">${money((Number(i.qty)||0)*(Number(i.price)||0))}</td>`:`<td class="num">${esc(i.qty)}</td><td class="num">${money(i.price)}</td><td class="num">${money((Number(i.qty)||0)*(Number(i.price)||0))}</td>`}</tr>`).join('');let head=`<div class="watermark"><img src="RAM%20Final%20Logo.png" alt=""></div><div class="header"><div><div class="logo"><img src="RAM%20Final%20Logo.png" alt="RAM Solutions logo"></div><div class="company">RAM Solutions</div><div class="tagline">IT Infrastructure | System Integration | Web Applications | POS Solutions | Cybersecurity</div></div><div class="title">${receipt?'RECEIPT AND ACKNOWLEDGEMENT':'INVOICE'}</div></div>`;
if(receipt){document.getElementById('doc').innerHTML=head+`<div class="receipt-top"><div class="received">Received From : ${esc(data.company)}</div><div class="receipt-meta">RA No : ${esc(data.receiptNo)}<br>Date: ${datefmt(data.receiptDate)}</div></div><table class="doc-table receipt-table"><colgroup><col class="no"><col class="description"><col class="currency"><col class="amount"></colgroup><thead><tr><th>No.</th><th>Description</th><th>Currency</th><th>Amount</th></tr></thead><tbody>${rows}<tr><td></td><td>${esc(data.paymentMethod)} /Cash Total</td><td class="num">${esc(data.currency)}</td><td class="num">${money(amount)}</td></tr></tbody></table><div class="receipt-signs"><div class="receipt-sign"><div class="signature-space"></div><div class="name">${esc(data.paidBy)}</div><div class="line"></div><div>Paid By:</div></div><div class="receipt-sign"><div class="signature-space">${receiptEsigns.receivedBy.url?`<img src="${receiptEsigns.receivedBy.url}" alt="Received By e-sign">`:``}</div><div class="name">${esc(data.receivedBy)}</div><div class="line"></div><div>Received By:</div></div></div><div class="footer">If you have any questions about this proformal receipt, please contact your Channel Account Manager (or)<br>[ ${esc(data.contactPerson)} ]</div>`}
else{let bal=amount-(Number(data.paid)||0);document.getElementById('doc').innerHTML=head+`<div class="inv-meta"><div><div class="cust-title">Customer Information</div><div class="cust-lines">Company Name:　 ${esc(data.company)}<br>Contact Person:　${esc(data.contact)}<br>Phone:　 ${esc(data.phone)}<br>Email:　 ${esc(data.email)}</div></div><div class="invno">Invoice No : ${esc(data.invoiceNo)}<br>Date: ${datefmt(data.invoiceDate)}</div></div><table class="doc-table"><colgroup><col style="width:6.2%"><col class="description"><col class="qty"><col class="price"><col class="amount"></colgroup><thead><tr><th>No.</th><th>Description</th><th>Qty</th><th>Unit Price</th><th>Amount(MMK)</th></tr></thead><tbody>${rows}</tbody></table><div class="inv-bottom"><div><div class="remark"><span>Remark :</span><span>${esc(data.remark)}</span></div><div class="warranty"><span>Warranty Term :</span><span>${esc(data.warranty)}</span></div></div><table class="totals"><tr><td>Subtotal</td><td>${money(amount)}</td></tr><tr><td>Paid</td><td>${money(data.paid)}</td></tr><tr><td>Balance</td><td>${money(bal)}</td></tr></table></div><div class="sign"><div class="signature-space" aria-hidden="true">${signatureUrl?`<img src="${signatureUrl}" alt="">`:``}</div><div class="signline"><span class="signname">${esc(data.authorizedBy)}</span><span>${datefmt(data.invoiceDate)}</span></div><div class="siglabels"><span>Authorized By</span><span>Date</span></div></div><div class="footer">If you have any questions about this proformal Invoice, please contact your Channel Account Manager (or)<br>[ ${esc(data.contactPerson)} ]</div>`}}
function setDoc(t){data.type=t;save(false);buildFields();render()}function save(notify=true){localStorage.setItem('ramDocs',JSON.stringify(data));if(notify){let b=document.querySelector('.actions button:nth-child(2)');b.textContent='Saved';setTimeout(()=>b.textContent='Save',900)}}function addItem(){data.items.push({description:'',qty:1,price:0});save(false);buildFields();render()}function removeItem(i){if(data.items.length<2)return;data.items.splice(i,1);save(false);buildFields();render()}buildFields();render();restoreEsign();restoreReceiptEsigns();loadRepoEsigns();
</script></body></html>
