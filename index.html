<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAM Solutions | Invoice & Receipt</title>
<style>
:root{--navy:#101d32;--red:#d71932;--blue:#153cff;--ink:#15191f;--line:#222;--muted:#687386;--paper:#fff;--bg:#eef1f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:355px 1fr}.side{background:#fff;padding:22px 20px;border-right:1px solid #dce1e8;overflow:auto;height:100vh;position:sticky;top:0}.brand{font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px;color:var(--navy)}.brand small{display:block;font-size:11px;color:#788394;font-weight:500}.mini-logo{width:38px;height:38px;border-radius:8px;background:#fff;display:grid;place-items:center;overflow:hidden}.mini-logo img{width:100%;height:100%;object-fit:contain}.tabs{display:flex;background:#f1f3f7;padding:4px;border-radius:10px;margin:22px 0 15px}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:7px;font-weight:700;color:#596273;cursor:pointer}.tabs button.active{background:#fff;color:var(--navy);box-shadow:0 1px 5px #15223820}.actions{display:flex;gap:8px;margin-bottom:14px}.actions button,.add{border:1px solid #d4dae2;background:white;color:var(--navy);border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.actions .primary{background:var(--navy);color:white;border-color:var(--navy);flex:1}.actions button:hover,.add:hover{filter:brightness(.96)}.section{border-top:1px solid #edf0f4;padding-top:14px;margin-top:14px}.section h3{font-size:11px;letter-spacing:.08em;color:#778194;text-transform:uppercase;margin:0 0 11px}.field{margin-bottom:10px}.field label{display:block;font-size:11px;color:#667184;margin-bottom:4px;font-weight:650}.field input,.field textarea,.field select{width:100%;padding:8px 9px;border:1px solid #d9dee6;border-radius:7px;font:inherit;font-size:13px;color:#1d2635;background:#fff;outline:none}.field textarea{resize:vertical;min-height:48px}.field input:focus,.field textarea:focus{border-color:#7d91bd;box-shadow:0 0 0 3px #234b9c13}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item-edit{border:1px solid #e3e7ed;padding:10px;border-radius:8px;margin:8px 0}.item-head{display:flex;justify-content:space-between;color:#697589;font-size:11px;margin-bottom:7px}.del{border:0;background:none;color:#ba3545;cursor:pointer}.add{width:100%;padding:7px}.hint{color:#778194;font-size:11px;margin-top:15px}.main{padding:28px;overflow:auto}.topline{max-width:930px;margin:0 auto 15px;display:flex;justify-content:space-between;align-items:center;color:#586579}.topline strong{color:#233148}.zoom{font-size:12px}.paper{width:min(100%,794px);min-height:1123px;margin:0 auto;background:var(--paper);box-shadow:0 12px 40px #2534501c;padding:6.9%;position:relative;overflow:hidden;font-family:Arial,sans-serif;color:#111}.paper.receipt{width:min(100%,1123px);min-height:794px;padding:5.2%;}.watermark{position:absolute;z-index:0;left:5%;top:20%;width:90%;height:72%;opacity:.11;pointer-events:none}.watermark img{width:100%;height:100%;object-fit:contain;display:block;mix-blend-mode:multiply}.receipt .watermark{left:7%;top:13%;width:86%;height:82%}.doc{position:relative;z-index:1}.header{display:grid;grid-template-columns:1fr auto;align-items:start}.logo{width:116px;height:98px;position:relative;margin-bottom:6px}.logo img{width:100%;height:100%;object-fit:contain;object-position:left center;display:block}.company{font-size:15px;line-height:1.45}.tagline{font-size:13px;white-space:nowrap}.title{font-size:21px;font-weight:400;align-self:start;margin-top:35px}.inv-meta{display:flex;justify-content:space-between;margin:25px 0 19px;font-size:13px}.cust-title{color:#222;margin-bottom:5px}.cust-lines{line-height:1.6}.invno{line-height:1.7;white-space:nowrap}.doc-table{border-collapse:collapse;width:100%;font-size:13px;table-layout:fixed}.doc-table th,.doc-table td{border:1px solid #333;padding:7px 8px;vertical-align:top}.doc-table th{text-align:center;font-weight:400}.doc-table .num{text-align:center}.doc-table .description{width:48%}.doc-table .qty{width:7%}.doc-table .price{width:17%}.doc-table .amount{width:22%}.desc{white-space:pre-line;line-height:1.34}.desc strong{font-weight:700}.blue{color:var(--blue)}.inv-bottom{display:grid;grid-template-columns:1fr 36%;gap:12px;margin-top:0;font-size:11px}.remark{color:#f02727;margin:9px 0 22px;line-height:1.25}.warranty{color:#f02727;line-height:1.25}.totals{border-collapse:collapse;width:100%;font-size:13px}.totals td{border:1px solid #333;padding:7px 9px}.totals td:last-child{text-align:right}.sign{margin:18px 0 0 auto;width:54%;text-align:center}.sign .signature-space{height:43px}.signline{border-bottom:2px solid #222;display:flex;justify-content:space-between;padding:2px 4px 5px;font-size:11px}.signname{color:#a31119;font-size:14px;max-width:70%;overflow-wrap:anywhere;text-align:left}.signline span:last-child{white-space:nowrap}.siglabels{display:flex;justify-content:space-between;font-size:11px;padding:4px}.footer{text-align:center;margin-top:55px;font-size:11px;line-height:1.4}.receipt .header{display:block;position:relative}.receipt .title{position:absolute;top:0;right:0;width:62%;text-align:right;font-size:22px;margin:0;white-space:nowrap}.receipt .logo{width:96px;height:88px;margin-bottom:2px}.receipt .company{font-size:17px}.receipt .tagline{font-size:15px}.receipt-top{display:flex;justify-content:space-between;align-items:end;margin:3px 0 8px;font-size:18px}.receipt-meta{text-align:right;line-height:1.65;white-space:nowrap}.received{font-size:18px;font-weight:700}.receipt-table{font-size:17px}.receipt-table th,.receipt-table td{padding:9px 10px}.receipt-table .no{width:6%}.receipt-table .description{width:54%}.receipt-table .currency{width:18%}.receipt-table .amount{width:22%}.receipt-desc{white-space:pre-line;line-height:1.4;min-height:185px}.receipt-signs{display:flex;justify-content:space-between;align-items:end;margin:42px 3% 6px}.receipt-sign{width:140px;text-align:center;font-size:11px}.receipt-sign .line{border-bottom:2px solid #222;height:28px}.receipt-sign .name{color:#a31119;font-size:14px}.receipt .footer{margin-top:12px;font-size:14px}.empty{padding:15px;text-align:center;color:#8390a1;font-size:12px}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{height:auto;position:relative}.main{padding:14px}.paper{transform-origin:top left}.topline{padding:0 4px}}
@media print{@page{size:A4 portrait;margin:0}body{background:#fff}.app{display:block}.side,.topline{display:none!important}.main{padding:0;overflow:visible}.paper{box-shadow:none;width:210mm;height:297mm;min-height:0;margin:0;padding:14mm 14.5mm;overflow:hidden}.paper.receipt{width:210mm;height:148.5mm;min-height:0;padding:9mm 11mm}@page{size:A4 portrait}.paper.receipt{page:receipt}.watermark{opacity:.11}.doc-table td{padding:6px 7px}.footer{margin-top:50px}@page receipt{size:A5 landscape;margin:0}}
</style>
</head><body><div class="app"><aside class="side"><div class="brand"><div class="mini-logo"><img src="RAM%20Final%20Logo.png" alt="RAM"></div><div>RAM Solutions<small>Invoice & Receipt Studio</small></div></div><div class="tabs"><button id="tabInvoice" class="active" onclick="setDoc('invoice')">Invoice</button><button id="tabReceipt" onclick="setDoc('receipt')">Receipt</button></div><div class="actions"><button class="primary" onclick="window.print()">Print / Save PDF</button><button onclick="save()">Save</button></div><div id="fields"></div><p class="hint">ပြင်ဆင်မှုများကို browser ထဲမှာ အလိုအလျောက်သိမ်းထားပါတယ်။ PDF ထုတ်ရန် Print / Save PDF ကိုနှိပ်ပါ။</p></aside><main class="main"><div class="topline"><strong id="viewTitle">Invoice preview · A4 portrait</strong><span class="zoom">Print-ready preview</span></div><section id="paper" class="paper"><div id="doc" class="doc"></div></section></main></div>
<script>
const base={type:'invoice',company:'MAEX Co.,Ltd',contact:'Yar Zar Htet',phone:'+959 969 371 114',email:'it@maex.com.mm',invoiceNo:'INE -2026-531',invoiceDate:'2026-10-29',receiptNo:'RNA -2026-826',receiptDate:'2026-10-30',paidBy:'',receivedBy:'Susan Shwine',paymentMethod:'Bank / Cheque No.',currency:'MMK',items:[{description:'Market Management System (MMS)\nEnhancement and New Modules\n\nMAEX PAY Mobile App Integration\n(Include MMQR + One Payment Channel)\n\nManagement Dashboard App Integration\n(50% Advance Deposit)',qty:1,price:21750000}],paid:0,remark:'The remaining 50% (21,750,000 MMK) of the project amount will be invoiced upon project completion.',warranty:'Only Hardware but excluding damages caused by electricity fluctuation, lightning, thundering, natural disaster and misuse from user.',authorizedBy:'Susan Shwine',contactPerson:'Susan Shwine Ms, (+95) 9 420044903, susanshwine@ramsolutions.asia'};
let data;try{data={...base,...JSON.parse(localStorage.getItem('ramDocs')||'{}')};data.items=JSON.parse(localStorage.getItem('ramDocs')||'{}').items||base.items}catch{data=structuredClone(base)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('en-US');const datefmt=s=>{if(!s)return '';let d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
const fld=(key,label,type='text',value=data[key])=>`<div class="field"><label>${label}</label><input type="${type}" value="${esc(value)}" data-key="${key}"></div>`;const area=(key,label)=>`<div class="field"><label>${label}</label><textarea data-key="${key}">${esc(data[key])}</textarea></div>`;
function buildFields(){let receipt=data.type==='receipt';document.getElementById('fields').innerHTML=`<div class="section"><h3>Customer details</h3>${fld('company','Company name')}${fld('contact','Contact person')}${fld('phone','Phone')}${fld('email','Email')}${receipt?fld('receiptNo','Receipt number'):fld('invoiceNo','Invoice number')}${fld(receipt?'receiptDate':'invoiceDate','Date','date')}</div><div class="section"><h3>Line items</h3><div id="itemFields">${data.items.map((it,i)=>`<div class="item-edit"><div class="item-head"><span>Item ${i+1}</span><button class="del" onclick="removeItem(${i})">Remove</button></div><div class="field"><label>Description</label><textarea data-item="${i}" data-col="description">${esc(it.description)}</textarea></div><div class="row"><div class="field"><label>Quantity</label><input type="number" min="0" step="any" data-item="${i}" data-col="qty" value="${esc(it.qty)}"></div><div class="field"><label>Unit price (MMK)</label><input type="number" min="0" step="any" data-item="${i}" data-col="price" value="${esc(it.price)}"></div></div></div>`).join('')}</div><button class="add" onclick="addItem()">+ Add line item</button></div>${receipt?`<div class="section"><h3>Payment</h3>${fld('paymentMethod','Payment channel')}${fld('currency','Currency')}${fld('paidBy','Paid by')}${fld('receivedBy','Received by')}</div>`:`<div class="section"><h3>Invoice notes</h3>${fld('paid','Paid amount (MMK)','number')}${area('remark','Remark')}${area('warranty','Warranty term')}${fld('authorizedBy','Authorized by')}</div>`}<div class="section"><h3>Company footer</h3>${fld('contactPerson','Contact information')}</div>`;
document.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('input',()=>{data[el.dataset.key]=el.value;save(false);render()}));document.querySelectorAll('[data-item]').forEach(el=>el.addEventListener('input',()=>{let it=data.items[el.dataset.item];let c=el.dataset.col;it[c]=c==='description'?el.value:Number(el.value);save(false);render()}));}
function render(){let receipt=data.type==='receipt';document.getElementById('paper').classList.toggle('receipt',receipt);document.getElementById('tabInvoice').classList.toggle('active',!receipt);document.getElementById('tabReceipt').classList.toggle('active',receipt);document.getElementById('viewTitle').textContent=receipt?'Receipt preview · A5 landscape':'Invoice preview · A4 portrait';let amount=data.items.reduce((s,i)=>s+(Number(i.qty)||0)*(Number(i.price)||0),0);let rows=data.items.map((i,n)=>`<tr><td class="num">${n+1}</td><td class="${receipt?'receipt-desc':'desc'}">${esc(i.description)}</td>${receipt?`<td></td><td class="num">${money((Number(i.qty)||0)*(Number(i.price)||0))}</td>`:`<td class="num">${esc(i.qty)}</td><td class="num">${money(i.price)}</td><td class="num">${money((Number(i.qty)||0)*(Number(i.price)||0))}</td>`}</tr>`).join('');let head=`<div class="watermark"><img src="RAM%20Final%20Logo.png" alt=""></div><div class="header"><div><div class="logo"><img src="RAM%20Final%20Logo.png" alt="RAM Solutions logo"></div><div class="company">RAM Solutions</div><div class="tagline">IT Infrastructure | System Integration | Web Applications | POS Solutions | Cybersecurity</div></div><div class="title">${receipt?'RECEIPT AND ACKNOWLEDGEMENT':'INVOICE'}</div></div>`;
if(receipt){document.getElementById('doc').innerHTML=head+`<div class="receipt-top"><div class="received">Received From : ${esc(data.company)}</div><div class="receipt-meta">RA No : ${esc(data.receiptNo)}<br>Date: ${datefmt(data.receiptDate)}</div></div><table class="doc-table receipt-table"><colgroup><col class="no"><col class="description"><col class="currency"><col class="amount"></colgroup><thead><tr><th>No.</th><th>Description</th><th>Currency</th><th>Amount</th></tr></thead><tbody>${rows}<tr><td></td><td>${esc(data.paymentMethod)} /Cash Total</td><td class="num">${esc(data.currency)}</td><td class="num">${money(amount)}</td></tr></tbody></table><div class="receipt-signs"><div class="receipt-sign"><div class="name">${esc(data.paidBy)}</div><div class="line"></div><div>Paid By:</div></div><div class="receipt-sign"><div class="name">${esc(data.receivedBy)}</div><div class="line"></div><div>Received By:</div></div></div><div class="footer">If you have any questions about this proformal receipt, please contact your Channel Account Manager (or)<br>[ ${esc(data.contactPerson)} ]</div>`}
else{let bal=amount-(Number(data.paid)||0);document.getElementById('doc').innerHTML=head+`<div class="inv-meta"><div><div class="cust-title">Customer Information</div><div class="cust-lines">Company Name:　 ${esc(data.company)}<br>Contact Person:　${esc(data.contact)}<br>Phone:　 ${esc(data.phone)}<br>Email:　 ${esc(data.email)}</div></div><div class="invno">Invoice No : ${esc(data.invoiceNo)}<br>Date: ${datefmt(data.invoiceDate)}</div></div><table class="doc-table"><colgroup><col style="width:6%"><col class="description"><col class="qty"><col class="price"><col class="amount"></colgroup><thead><tr><th>No.</th><th>Description</th><th>Qty</th><th>Unit Price</th><th>Amount(MMK)</th></tr></thead><tbody>${rows}</tbody></table><div class="inv-bottom"><div><div class="remark">Remark　:　${esc(data.remark)}</div><div class="warranty">Warranty Term　:　${esc(data.warranty)}</div></div><table class="totals"><tr><td>Subtotal</td><td>${money(amount)}</td></tr><tr><td>Paid</td><td>${money(data.paid)}</td></tr><tr><td>Balance</td><td>${money(bal)}</td></tr></table></div><div class="sign"><div class="signature-space" aria-hidden="true"></div><div class="signline"><span class="signname">${esc(data.authorizedBy)}</span><span>${datefmt(data.invoiceDate)}</span></div><div class="siglabels"><span>Authorized By</span><span>Date</span></div></div><div class="footer">If you have any questions about this proformal Invoice, please contact your Channel Account Manager (or)<br>[ ${esc(data.contactPerson)} ]</div>`}}
function setDoc(t){data.type=t;save(false);buildFields();render()}function save(notify=true){localStorage.setItem('ramDocs',JSON.stringify(data));if(notify){let b=document.querySelector('.actions button:nth-child(2)');b.textContent='Saved';setTimeout(()=>b.textContent='Save',900)}}function addItem(){data.items.push({description:'',qty:1,price:0});save(false);buildFields();render()}function removeItem(i){if(data.items.length<2)return;data.items.splice(i,1);save(false);buildFields();render()}buildFields();render();
</script></body></html>
